name: Day 5 self-check

on:
  push:
    paths:
      - submissions/**
      - REPORT.md
      - .github/workflows/day5-self-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: day5-self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check CVAT export structure
        shell: bash
        run: |
          set +e
          python scripts/inspect_submissions.py --dir submissions > "$RUNNER_TEMP/structure.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/structure.txt"
          {
            echo '## Day 5 — kiểm cấu trúc ZIP'
            echo '```text'
            cat "$RUNNER_TEMP/structure.txt"
            echo '```'
            if [ "$result" -ne 0 ]; then
              echo 'Có ZIP lỗi cấu trúc. Sửa trong CVAT, Save, export lại và push lại.'
            else
              echo 'OK chỉ xác nhận cấu trúc; chưa chứng minh mask đúng.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain the scope of this check
        shell: bash
        run: |
          {
            echo '## Giới hạn của kiểm tra tự động'
            echo 'Workflow trong fork chỉ kiểm cấu trúc ZIP; không tải đáp án và không tính điểm.'
            echo 'Kết quả OK không chứng minh mask đúng. Bảng xếp hạng mini-hackathon (nếu mở) được chấm bởi hệ thống riêng trên commit đã khóa; điểm chính thức /100 vẫn theo quy trình lớp.'
          } >> "$GITHUB_STEP_SUMMARY"
